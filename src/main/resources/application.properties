# -----------------------------
# Application Configuration
# -----------------------------
spring.application.name=lms-b

# -----------------------------
# Datasource Configuration
# -----------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# JPA / Hibernate Configuration
# -----------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.springframework.security=DEBUG

# -----------------------------
# Liquibase Configuration
# -----------------------------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=lms_db
spring.liquibase.drop-first=false

#logging.level.liquibase=DEBUG
#logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

# -----------------------------
# Server Configuration
# -----------------------------
server.port=9090

# -----------------------------
# Spring Security
# -----------------------------
spring.security.user.name=${SPRING_SECURITY_USERNAME}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

# -----------------------------
# Mail Configuration
# -----------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# -----------------------------
# Swagger
# -----------------------------
springdoc.swagger-ui.persistAuthorization=true

# -----------------------------
# Strapi Configuration
# -----------------------------
strapi.url=${STRAPI_URL}
strapi.api.token=${STRAPI_API_TOKEN}

# -----------------------------
# File Upload Limits
# -----------------------------
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# -----------------------------
# Twilio Configuration
# -----------------------------
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.from.number=${TWILIO_FROM_NUMBER}