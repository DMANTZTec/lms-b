# ============================================
# LMS Application - UAT (Staging) Profile
# ============================================
# Activate: SPRING_PROFILES_ACTIVE=uat
# ============================================

  # ------------------------------------------
  # Datasource
  # ------------------------------------------
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/lms
    username: lmsappuser
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  liquibase:
    enabled: true
    default-schema: ${DB_NAME:lms}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # ------------------------------------------
  # Mail Credentials
  # ------------------------------------------
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

# ------------------------------------------
# Logging
# ------------------------------------------
logging:
  level:
    com.dmantz.lms: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# ------------------------------------------
# Strapi CMS
# ------------------------------------------
strapi:
  url: ${STRAPI_URL}
  api:
    token: ${STRAPI_API_TOKEN}

# ------------------------------------------
# Twilio SMS
# ------------------------------------------
twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID}
  auth:
    token: ${TWILIO_AUTH_TOKEN}
  from:
    number: ${TWILIO_FROM_NUMBER}
