# ============================================
# LMS Application - Local Development Profile
# ============================================
# Activate: SPRING_PROFILES_ACTIVE=local
# Local overrides for the default application.yml.
# ============================================

spring:
  # ------------------------------------------
  # Datasource
  # ------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/lms_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ------------------------------------------
  # JPA / Hibernate
  # ------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  # ------------------------------------------
  # Mail Credentials
  # ------------------------------------------
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

# ------------------------------------------
# Logging
# ------------------------------------------
logging:
  level:
    com.dmantz.lms: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# ------------------------------------------
# Strapi CMS
# ------------------------------------------
strapi:
  url: ${STRAPI_URL:http://localhost:1337}
  api:
    token: ${STRAPI_API_TOKEN:local-token}

# ------------------------------------------
# Twilio SMS
# ------------------------------------------
twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:local-sid}
  auth:
    token: ${TWILIO_AUTH_TOKEN:local-token}
  from:
    number: ${TWILIO_FROM_NUMBER:+1234567890}
