<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LMS Razorpay Payment Test</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 30px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px; padding: 12px 16px; }
  legend { font-weight: 600; }
  label { display: block; margin: 8px 0 4px; font-size: 14px; }
  input, textarea { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
  button { margin: 10px 8px 0 0; padding: 9px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button.secondary { background: #555; }
  pre { background: #111; color: #9fe39f; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto; font-size: 12px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .hint { font-size: 12px; color: #666; }
</style>
</head>
<body>

<h1>LMS Razorpay payment test</h1>

<fieldset>
  <legend>1. Backend + student token</legend>
  <label>API base URL</label>
  <input id="baseUrl" value="http://localhost:9090/lms">
  <label>Student JWT (from /api/student/verify-login-otp, without "Bearer ")</label>
  <textarea id="token" rows="3"></textarea>
</fieldset>

<fieldset>
  <legend>2. What to buy (fill only ONE)</legend>
  <div class="row">
    <div><label>courseId</label><input id="courseId" placeholder="e.g. C101"></div>
    <div><label>programId</label><input id="programId" placeholder="e.g. P01"></div>
  </div>
  <button onclick="payNow()">Checkout &amp; Pay</button>
  <button class="secondary" onclick="myPayments()">My payments</button>
  <p class="hint">
    Razorpay TEST mode: card 4111 1111 1111 1111, any future expiry, any CVV, OTP any value.
    UPI: success@razorpay (success) / failure@razorpay (failure).
  </p>
</fieldset>

<fieldset>
  <legend>Log</legend>
  <pre id="log">Ready.</pre>
</fieldset>

<script>
  const $ = (id) => document.getElementById(id).value.trim();

  function log(title, data) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    const body = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    el.textContent = `[${time}] ${title}\n${body}\n\n` + el.textContent;
  }

  async function api(method, path, body) {
    const res = await fetch($('baseUrl') + path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + $('token')
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    let data;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) {
      throw new Error(`${method} ${path} -> ${res.status}\n${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}`);
    }
    return data;
  }

  async function payNow() {
    try {
      // ---- Step 1: create order (payment row = CREATED, no enrollment yet)
      const body = {};
      if ($('courseId')) body.courseId = $('courseId');
      if ($('programId')) body.programId = $('programId');

      log('POST /api/checkout request', body);
      const checkout = await api('POST', '/api/checkout', body);
      log('POST /api/checkout response', checkout);

      // Free course: already enrolled, no popup
      if (!checkout.paymentRequired) {
        log('FREE - enrolled directly', 'enrollmentId = ' + checkout.enrollmentId);
        return;
      }

      // ---- Step 2: open Razorpay popup
      const rzp = new Razorpay({
        key: checkout.keyId,
        order_id: checkout.razorpayOrderId,
        amount: checkout.amountInPaise,
        currency: checkout.currency,
        name: 'LMS',
        description: checkout.itemName,
        prefill: {
          name: checkout.studentName,
          email: checkout.studentEmail,
          contact: checkout.studentMobile
        },

        // ---- Step 3: payment success -> verify on backend (creates enrollment)
        handler: async function (resp) {
          log('Razorpay success callback', resp);
          try {
            const verified = await api('POST', '/api/payments/verify', {
              razorpayOrderId: resp.razorpay_order_id,
              razorpayPaymentId: resp.razorpay_payment_id,
              razorpaySignature: resp.razorpay_signature
            });
            log('POST /api/payments/verify response (status PAID, enrollment created)', verified);
          } catch (e) {
            log('VERIFY FAILED', e.message);
          }
        },

        modal: {
          ondismiss: () => log('Popup closed', 'Payment stays CREATED. Click Checkout again to reuse the same order.')
        }
      });

      rzp.on('payment.failed', (resp) => log('Razorpay payment.failed', resp.error));
      rzp.open();

    } catch (e) {
      log('ERROR', e.message);
    }
  }

  async function myPayments() {
    try {
      log('GET /api/payments/me', await api('GET', '/api/payments/me'));
    } catch (e) {
      log('ERROR', e.message);
    }
  }
</script>
</body>
</html>
