  # ============================================
  # LMS Application - UAT Profile
  # ============================================

  spring:

    # ------------------------------------------
    # Datasource
    # ------------------------------------------
    datasource:
      url: jdbc:mysql://103.12.1.147:3306/lms
      username: lmsappuser
      password: "Dmantz$123"
      driver-class-name: com.mysql.cj.jdbc.Driver

    # ------------------------------------------
    # Liquibase
    # ------------------------------------------
    liquibase:
      enabled: true
      default-schema: lms

    # ------------------------------------------
    # JPA
    # ------------------------------------------
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: false

    # ------------------------------------------
    # Mail
    # ------------------------------------------
    mail:
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}


  # ============================================
  # Logging
  # ============================================

  logging:
    level:
      com.dmantz.lms: INFO
      org.springframework.security: INFO
      org.hibernate.SQL: WARN


  # ============================================
  # Strapi
  # ============================================

  strapi:
    url: ${STRAPI_URL}
    api:
      token: ${STRAPI_API_TOKEN}


  # ============================================
  # Twilio
  # ============================================

  twilio:
    account:
      sid: ${TWILIO_ACCOUNT_SID}

    auth:
      token: ${TWILIO_AUTH_TOKEN}

    from:
      number: ${TWILIO_FROM_NUMBER}

